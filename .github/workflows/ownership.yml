name: Native ownership

on:
  pull_request:
    paths:
      - '4DPlugin.*'
      - '4D Plugin API/**'
      - '.github/tests/**'
      - '.github/workflows/ownership.yml'
  push:
    branches: [master]
    paths:
      - '4DPlugin.*'
      - '4D Plugin API/**'
      - '.github/tests/**'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Actual-source ownership regressions (ASan and UBSan)
        run: python3 .github/tests/run_ownership.py
      - name: Existing lifecycle regressions (no publication)
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -q
